<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RAPJIE IDE // BLACK HAT</title>
    <!-- Panggil Ace Editor via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.7/ace.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Share Tech Mono', monospace; }
        body { background-color: #000; color: #00FF41; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        #splash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 999; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center; padding: 20px;
        }
        #splash h1 { font-size: 22px; text-shadow: 0 0 10px #00FF41; margin-bottom: 20px; }
        #splash p { color: #888; font-size: 14px; margin-bottom: 5px; }
        #splash .system { color: #00FF41; font-size: 12px; text-align: left; width: 100%; max-width: 300px; margin-top: 20px;}
        
        /* Header */
        header {
            background: #0a0a0a; padding: 10px; border-bottom: 1px solid #222;
            display: flex; justify-content: space-between; align-items: center;
        }
        header h2 { font-size: 16px; text-shadow: 0 0 5px #00FF41; }
        .status { font-size: 12px; color: #FFAA00; }

        /* Toolbar */
        .toolbar {
            display: flex; background: #111; border-bottom: 1px solid #222; padding: 5px;
        }
        .toolbar button {
            flex: 1; background: transparent; color: #00FF41; border: 1px solid #00FF41;
            padding: 8px; margin: 0 5px; font-weight: bold; cursor: pointer;
            text-shadow: 0 0 5px #00FF41;
        }
        .toolbar button:active { background: #00FF41; color: #000; text-shadow: none; }

        /* Editor & Preview */
        #container { display: flex; flex-direction: column; flex: 1; }
        #editor { flex: 1; font-size: 14px; }
        
        #preview-container {
            flex: 1; border-top: 2px solid #00FF41; background: #fff; display: none;
            position: relative;
        }
        #preview-header {
            background: #111; color: #00FF41; padding: 5px 10px; font-size: 12px;
            display: flex; justify-content: space-between;
        }
        #preview { width: 100%; height: calc(100% - 25px); border: none; background: #fff; }

        /* Footer Terminal */
        footer {
            background: #0a0a0a; color: #888; padding: 5px 10px; font-size: 11px;
            border-top: 1px solid #222;
        }
    </style>
</head>
<body>

    <div id="splash">
        <h1>[ RAPJIE IDE // BLACK HAT ]</h1>
        <p>Initializing secure environment...</p>
        <div class="system" id="boot-log"></div>
    </div>

    <header>
        <h2>RAPJIE_IDE</h2>
        <div class="status">● SECURE</div>
    </header>

    <div class="toolbar">
        <button onclick="runCode()">▶ RUN CODE</button>
        <button onclick="clearCode()">⨯ CLEAR</button>
    </div>

    <div id="container">
        <!-- Editor Area -->
        <div id="editor">// Selamat datang di RAPJIE IDE, Operator.
// Tulis kode HTML/CSS/JS lo di sini.
// Tekan RUN CODE buat liat hasilnya.

<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background: #111;
            color: #00FF41;
            font-family: monospace;
            text-align: center;
            padding-top: 50px;
        }
        h1 { text-shadow: 0 0 10px #00FF41; }
    </style>
</head>
<body>
    <h1>HACK THE PLANET</h1>
    <p>RAPJIE SYSTEM ONLINE.</p>
</body>
</html></div>
        
        <!-- Preview Area -->
        <div id="preview-container">
            <div id="preview-header">
                <span>TERMINAL OUTPUT</span>
                <span onclick="closePreview()" style="cursor:pointer;">[X] CLOSE</span>
            </div>
            <iframe id="preview"></iframe>
        </div>
    </div>

    <footer>
        <span id="footer-text">Ready. Awaiting input...</span>
    </footer>

    <script>
        // --- BOOT SEQUENCE ---
        const bootLogs = [
            "> Bypassing mainframe... [OK]",
            "> Injecting payload... [OK]",
            "> Establishing proxy... [OK]",
            "> ACCESS GRANTED."
        ];
        let logIndex = 0;
        const logElement = document.getElementById('boot-log');
        
        function printLog() {
            if (logIndex < bootLogs.length) {
                const p = document.createElement('div');
                p.innerText = bootLogs[logIndex];
                logElement.appendChild(p);
                logIndex++;
                setTimeout(printLog, 600);
            } else {
                setTimeout(() => {
                    document.getElementById('splash').style.display = 'none';
                }, 1000);
            }
        }
        setTimeout(printLog, 500);

        // --- ACE EDITOR SETUP ---
        var editor = ace.edit("editor");
        editor.setTheme("ace/theme/tomorrow_night_eighties"); // Tema hacker
        editor.session.setMode("ace/mode/html");
        editor.setOptions({
            fontSize: "14px",
            showPrintMargin: false,
            useWorker: false,
            wrap: true
        });

        // --- LOGIC ---
        function runCode() {
            const code = editor.getValue();
            const previewContainer = document.getElementById('preview-container');
            const previewFrame = document.getElementById('preview');
            
            // Tampilkan preview
            previewContainer.style.display = 'block';
            
            // Tulis kode ke iframe
            const previewDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;
            previewDoc.open();
            previewDoc.write(code);
            previewDoc.close();

            document.getElementById('footer-text').innerText = "Code executed successfully.";
        }

        function closePreview() {
            document.getElementById('preview-container').style.display = 'none';
            document.getElementById('footer-text').innerText = "Preview closed.";
        }

        function clearCode() {
            editor.setValue("", -1);
            document.getElementById('footer-text').innerText = "Buffer cleared.";
        }
    </script>
</body>
</html>
